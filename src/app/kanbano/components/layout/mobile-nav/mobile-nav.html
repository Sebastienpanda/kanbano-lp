<nav
    [class.activeNav]="isActive()"
    [attr.inert]="isActive() ? null : ''"
    aria-label="Navigation principale"
    class="nav"
>
    <div class="nav-top">
        <picture class="logo">
            <source sizes="219px" srcset="/assets/logo/logo-light/logo-light.avif 219w" type="image/avif" />
            <source sizes="219px" srcset="/assets/logo/logo-light/logo-light.webp 219w" type="image/webp" />
            <img
                alt="Kanbano"
                fetchpriority="high"
                height="45"
                loading="eager"
                sizes="219px"
                src="/assets/logo/logo-light/logo-light.png"
                width="219"
            />
        </picture>
    </div>

    <ul class="lists">
        @for (item of nav(); track item.link) {
        <li class="item">
            <a (click)="linkClicked.emit()" [fragment]="item.link" [routerLink]="['/']" class="link">
                <span class="item-index" aria-hidden="true">0{{ $index + 1 }}</span>
                <span class="item-label">{{ item.name }}</span>
                <svg class="item-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                        d="M7 17L17 7M17 7H7M17 7V17"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </a>
        </li>
        }
    </ul>

    <div class="nav-footer">
        <div class="nav-footer-divider"></div>
        <div class="nav-footer-actions">
            <button
                class="toggle-theme"
                [attr.aria-label]="theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"
                (click)="themeToggle.emit()"
            >
                @if (theme() === 'dark') {
                <svg width="20" height="20" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                    <mask
                        id="mask-mobile"
                        style="mask-type: luminance"
                        maskUnits="userSpaceOnUse"
                        x="0"
                        y="0"
                        width="15"
                        height="15"
                    >
                        <path d="M14.25 14.25V0.75H0.75V14.25H14.25Z" fill="white" stroke="white" stroke-width="1.5" />
                    </mask>
                    <g mask="url(#mask-mobile)">
                        <path
                            d="M7.5 11.0156C5.56137 11.0156 3.98438 9.43863 3.98438 7.5C3.98438 5.56137 5.56137 3.98437 7.5 3.98437C9.43863 3.98437 11.0156 5.56137 11.0156 7.5C11.0156 9.43863 9.43863 11.0156 7.5 11.0156Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M7.5 0.585938V1.75781"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M7.5 13.2422V14.4141"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M13.2422 7.5H14.4141"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M0.585938 7.5H1.75781"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M1.64062 1.64063L3.35985 3.35986"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M13.3598 1.64068L11.6416 3.35889"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M13.3598 13.3594L11.6416 11.6412"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M1.64062 13.3594L3.35883 11.6412"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-miterlimit="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </g>
                </svg>
                } @else {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                        d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                }
                <span class="toggle-label">{{ theme() === 'dark' ? 'Mode clair' : 'Mode sombre' }}</span>
            </button>
            <kanbano-lp-button [full]="true">Rejoindre la file d'attente</kanbano-lp-button>
        </div>
    </div>
</nav>
