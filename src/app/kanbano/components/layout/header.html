<header class="header">
    <div class="container header-container">
        <a class="logo" [class.light-section]="!showLightElements()" routerLink="/">
            <picture class="logo-variant logo-variant--dark">
                <source sizes="219px" srcset="/assets/logo/logo-dark/logo-dark.avif 219w" type="image/avif" />
                <source sizes="219px" srcset="/assets/logo/logo-dark/logo-dark.webp 219w" type="image/webp" />
                <img
                    alt=""
                    fetchpriority="high"
                    height="45"
                    loading="eager"
                    sizes="264px"
                    src="/assets/logo/logo-dark/logo-dark.png"
                    srcset="/assets/logo/logo-dark/logo-dark.png 219w"
                    width="219"
                />
            </picture>
            <picture class="logo-variant logo-variant--light">
                <source sizes="219px" srcset="/assets/logo/logo-light/logo-light.avif 219w" type="image/avif" />
                <source sizes="219px" srcset="/assets/logo/logo-light/logo-light.webp 219w" type="image/webp" />
                <img
                    alt=""
                    fetchpriority="high"
                    height="45"
                    loading="eager"
                    sizes="264px"
                    src="/assets/logo/logo-light/logo-light.png"
                    srcset="/assets/logo/logo-light/logo-light.png 219w"
                    width="219"
                />
            </picture>
        </a>

        <button
            type="button"
            class="menu"
            [class.active]="isMenuOpen()"
            [attr.aria-expanded]="isMenuOpen()"
            aria-label="Menu de navigation"
            (click)="toggleMenu()"
        >
            <span class="burger"></span>
        </button>

        @if (isDesktop()) {
        <kanbano-lp-nav-desktop [nav]="nav()" />
        } @else {
        <kanbano-lp-mobile-nav
            (linkClicked)="isMenuOpen.set(false)"
            (themeToggle)="userTheme.toggle()"
            [isActive]="isMenuOpen()"
            [nav]="nav()"
            [theme]="userTheme.theme()"
        />
        }
        <div class="right">
            <button
                type="button"
                class="toggle-theme"
                [class.right-section]="showLightElements()"
                [attr.aria-label]="userTheme.theme() === 'light' ? 'Passer en mode sombre' : 'Passer en mode clair'"
                (click)="userTheme.toggle()"
            >
                <svg lucideSun class="theme-icon" [class.theme-icon--visible]="userTheme.theme() === 'light'"></svg>
                <svg lucideMoon class="theme-icon" [class.theme-icon--visible]="userTheme.theme() === 'dark'"></svg>
            </button>
            <kanbano-lp-button>Rejoindre la file d'attente</kanbano-lp-button>
        </div>
    </div>
</header>
