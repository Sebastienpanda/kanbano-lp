<header class="header">
    <div class="container header-container" #headerContainer>
        <a aria-label="Kanbano — Retour à l'accueil" class="header-logo" routerLink="/">
            <picture class="header-logo-picture">
                @if (isDark() || isMenuOpen()) {
                <source sizes="219px" srcset="/assets/logo/logo-light/logo-light.avif 219w" type="image/avif" />
                <source sizes="219px" srcset="/assets/logo/logo-light/logo-light.webp 219w" type="image/webp" />
                } @else {
                <source sizes="219px" srcset="/assets/logo/logo-dark/logo-dark.avif 219w" type="image/avif" />
                <source sizes="219px" srcset="/assets/logo/logo-dark/logo-dark.webp 219w" type="image/webp" />
                }
                <img
                    alt=""
                    fetchpriority="high"
                    height="45"
                    loading="eager"
                    sizes="264px"
                    src="/assets/logo/logo-light/logo-light.png"
                    srcset="/assets/logo/logo-light/logo-light.png 219w"
                    width="219"
                />
            </picture>
        </a>

        <button
            type="button"
            class="header-menu"
            [class.active]="isMenuOpen()"
            [attr.aria-expanded]="isMenuOpen()"
            aria-label="Menu de navigation"
            (click)="toggleMenu()"
        >
            <span class="header-burger"></span>
        </button>

        <kanbano-lp-nav-desktop [nav]="nav()" />
        <div class="header-right">
            <button
                type="button"
                class="header-toggle-theme"
                [class.header-toggle-theme-light]="isDark()"
                [attr.aria-label]="userTheme.theme() === 'light' ? 'Passer en mode sombre' : 'Passer en mode clair'"
                (click)="userTheme.toggle()"
            >
                <svg
                    lucideSun
                    class="header-theme-icon"
                    [class.header-theme-icon-visible]="userTheme.theme() === 'light'"
                ></svg>
                <svg
                    lucideMoon
                    class="header-theme-icon"
                    [class.header-theme-icon-visible]="userTheme.theme() === 'dark'"
                ></svg>
            </button>
            <kanbano-lp-button>Rejoindre la file d'attente</kanbano-lp-button>
        </div>
    </div>
    <kanbano-lp-mobile-nav
        (linkClicked)="isMenuOpen.set(false)"
        (themeToggle)="userTheme.toggle()"
        [isActive]="isMenuOpen()"
        [nav]="nav()"
        [theme]="userTheme.theme()"
    />
</header>
