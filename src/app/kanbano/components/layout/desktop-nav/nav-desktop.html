<nav aria-label="Navigation principale" class="nav" [class.theme-light]="theme() === 'dark'">
    <ul class="lists">
        @for (item of nav(); track item.link) {
        <li class="item">
            <a [fragment]="item.link" [routerLink]="['/']" class="link"> {{ item.name }} </a>
        </li>
        }
    </ul>
</nav>
