<section class="preview">

    <div class="preview__purple"></div>
    <div class="preview__pink"></div>
    <div class="preview__green"></div>
    <div class="preview__purple-right"></div>

    <div class="preview__images">
        <picture class="preview__images-top">
            <source
                sizes="(min-width: 768px) 675px, 316px"
                srcset="/assets/preview/dashboard/dashboard.webp 316w, /assets/preview/dashboard/dashboard@2x.webp 675w"
                type="image/webp">
            <img alt="" sizes="(min-width: 768px) 675px, 316px"

                 fetchpriority="high"

        <picture class="preview__images-left">
            <source
                sizes="(min-width: 768px) 162px, 100px"

            <img alt="" sizes="(min-width: 768px) 162px, 100px"
                 src="/assets/preview/task-details/task-details.png"
                 decoding="sync"
                 fetchpriority="high"
                 loading="eager"
                 srcset="/assets/preview/task-details/task-details.png 100w, /assets/preview/task-details/task-details@2x.png 162w">
        </picture>
        <picture class="preview__images-right">
            <source
                sizes="(min-width: 768px) 162px, 100px"

                type="image/webp">
            <img alt="" sizes="(min-width: 768px) 162px, 100px"

                 fetchpriority="high"
                 loading="eager"
                 srcset="/assets/preview/task-view/task-view.png 100w, /assets/preview/task-view/task-view@2x.png 162w">
        </picture>
